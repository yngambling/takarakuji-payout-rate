name: 還元率を更新して公開

on:
  # ふだんは外部のタイマー（cron-job.org）が、日本時間の 7:47・12:47・19:47・21:47・23:47 に
  # 「workflow_dispatch」でこのワークフローを動かします（README「定時更新を時刻どおりに動かす」）。
  # 2026年8月ごろから GitHub の予約（schedule）は数時間遅れたり抜けたりするため、下の予約は予備です。
  schedule:
    # 時刻は UTC（日本時間 = UTC+9）
    - cron: '47 22 * * *'  # 07:47 朝の更新（公式ページの見張りもこの回で行う）
    - cron: '47 3 * * *'   # 12:47 昼（BIG・DUNKの販売回の切り替わり）
    - cron: '47 10 * * *'  # 19:47 ロト・ナンバーズの抽せん（18:45）のあと
    - cron: '47 12 * * *'  # 21:47 取りこぼしの再取得
    - cron: '47 14 * * *'  # 23:47 BIG・DUNKの結果発表のあと
  workflow_dispatch:
    inputs:
      watch:
        description: '公式ページの見張りも今すぐ行う（ふだんは朝6時以降の最初の更新で1日1回だけ行います）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'data/state.json'
      - 'data/history.json'
      - 'data/log.json'
      - 'data/watch.json'
      - 'data/pages.json'
      - 'data/indexnow.json'
      - 'README.md'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write   # 確認が必要なことを Issue でお知らせするため

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 外部のタイマーと GitHub の予約の実行が続いても、いつも最新の main から始める（前の回のデータの保存と食い違わないように）
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 公式サイトから最新データを取得
        if: github.event_name != 'push'
        run: node scripts/fetch.mjs
        env:
          # 過去1年分を1回に何件さかのぼるか（空なら12件）。リポジトリの変数 BACKFILL_PER_RUN で変えられます
          BACKFILL_PER_RUN: ${{ vars.BACKFILL_PER_RUN }}

      # 1日1回だけ（日本時間の朝6時以降の最初の更新）。同じ日の2回目からは watch.mjs が何もしないで終わる
      # 新しいジャンボ宝くじの自動登録もここで行う（GITHUB_TOKEN は、運営者が閉じた Issue＝確認済みを読むため）
      - name: 公式ページの変化をチェック（1日1回）
        if: github.event_name != 'push'
        run: node scripts/watch.mjs
        env:
          WATCH_FORCE: ${{ inputs.watch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 計算の確認
        run: node scripts/test.mjs

      - name: サイトを生成
        run: node scripts/build.mjs

      # 検索エンジン（Bing など）に知らせるページを選ぶ（1日1回。朝6時以降の最初の更新で、内容が変わったページだけ）。送るのは公開のあと
      - name: 検索エンジンへの通知を準備（IndexNow）
        if: github.event_name != 'push'
        run: node scripts/indexnow.mjs plan

      - name: 取得したデータをリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash || true
            git push
          fi

      # 取得の失敗・公式ページの変化・自動更新の停止などを、Issue（GitHub の通知メール）でお知らせする。直ったら自動で閉じる
      - name: 確認が必要なことを知らせる
        if: always()
        run: node scripts/notify.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}

      # Cloudflare Pages で公開する場合は、リポジトリの変数 DEPLOY_TARGET に cloudflare を入れると下の3つは動きません
      - uses: actions/configure-pages@v6
        if: vars.DEPLOY_TARGET != 'cloudflare'

      - uses: actions/upload-pages-artifact@v5
        if: vars.DEPLOY_TARGET != 'cloudflare'
        with:
          path: dist

  deploy:
    needs: build
    if: vars.DEPLOY_TARGET != 'cloudflare'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # 公開したあとで、内容が変わったページを検索エンジン（Bing など）に知らせる（IndexNow）。選んだ回だけ送る。失敗しても公開には影響しない
      - uses: actions/checkout@v7
        if: github.event_name != 'push'
        with:
          ref: main

      - uses: actions/setup-node@v7
        if: github.event_name != 'push'
        with:
          node-version: 22

      - name: 検索エンジンに更新を知らせる（IndexNow）
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/indexnow.mjs send
